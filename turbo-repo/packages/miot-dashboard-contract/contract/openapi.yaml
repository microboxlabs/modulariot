# Dashboard wire contract — the HTTP surface both halves agree on.
#
# In @microboxlabs/miot-dashboard-contract rather than the server, so that
# implementing this API in another language, or writing a client for it, needs
# no Node install.
#
# @microboxlabs/miot-dashboard-server implements it, serves it at /openapi.yaml
# and renders it at /docs. The Bruno collection in that package's rest-api/
# exercises the same operations, including the ones that must fail.
openapi: 3.1.0
info:
  title: MIOT Dashboard API
  version: 0.1.0-draft
  description: >
    Persistence, tenancy and capabilities for embeddable dashboards.


    The request names the tenant and the scope, in the path, and **neither is
    believed**. The credential identifies the caller and nothing more; the
    server then asks whether that caller may act in the tenant named, and
    whether they have a role in the scope named. A tenant or scope the caller
    has no standing in is refused with the same 403 as one that does not
    exist, so the path reveals nothing by probing, and no store is consulted
    before the check.


    Failures share one envelope, so a client parses one shape.
  x-status: draft

servers:
  - url: /
    description: >
      The server this document was served from. The standalone server serves
      the API at the root unless MIOT_DASHBOARD_BASE_PATH is set; a host that
      mounts the library chooses its own prefix.

tags:
  - name: dashboards
    description: Reading, writing and removing dashboard configurations.
  - name: access
    description: What the caller may do, and who else may do what.
  - name: datasources
    description: Where a dashboard's data comes from. Tenant-level.
  - name: credentials
    description: >
      How a datasource authenticates, where this server is the one keeping
      them. Absent where another system is.

security:
  - bearerAuth: []
  - ticketAuth: []
  - embedToken: []
  - devUser: []

paths:
  /tenants/{tenantId}/scopes/{scopeId}/dashboards:
    get:
      operationId: listDashboards
      tags: [dashboards]
      summary: Dashboards in one scope
      description: >
        Every dashboard in the scope, for a caller with any standing in it.
        The list is drawn under the tenant in the request path, so two tenants
        sharing a scope identifier never see each other's entries.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
      responses:
        "200":
          description: The dashboards in this scope. An empty list is a 200, not a 404.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/scopes/{scopeId}/dashboards/{slug}:
    get:
      operationId: loadDashboard
      tags: [dashboards]
      summary: One dashboard's configuration
      description: >
        A dashboard the caller may see but which does not exist yet answers
        `200` with `data: null`, not `404`. The distinction matters to an
        editor: "nothing saved here yet" is a starting point, while `404` would
        be an error to report. A dashboard the caller may *not* see is `403`,
        so absence never leaks through this endpoint.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The stored configuration, or null when nothing is stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DashboardConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: saveDashboard
      tags: [dashboards]
      summary: Create or replace a dashboard's configuration
      description: >
        The body replaces the stored configuration outright; there is no merge.


        Send `If-Match` with the revision you loaded. A write whose expected
        revision is stale is refused with `409`, which is what stops two
        editors — or an editor and the AI generation skill — from silently
        overwriting one another. Omit the header only for a first write.


        Creating a dashboard that does not exist yet is decided by scope
        standing (Contributor or above), because a dashboard with no record has
        no capabilities to consult.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/slug"
        - $ref: "#/components/parameters/ifMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Not #/components/schemas/DashboardConfig: that one is nullable,
              # because a GET of an empty slug returns null. A save is not.
              $ref: "dashboard-config.schema.json#/definitions/DashboardConfig"
      responses:
        "200":
          description: Saved. The new revision is what the next If-Match must carry.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/SaveResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

    delete:
      operationId: deleteDashboard
      tags: [dashboards]
      summary: Remove a dashboard
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/slug"
      responses:
        "204":
          description: Removed. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/scopes/{scopeId}/dashboards/{slug}/capabilities:
    get:
      operationId: getDashboardCapabilities
      tags: [access]
      summary: The caller's effective capabilities on one dashboard
      description: >
        Server half of the UI package's Seam F. Replaces the host-specific
        access endpoint an embed host would otherwise have to reimplement.
        The answer is the caller's role-derived capabilities intersected with
        the ceiling their credential carries; an embed token always resolves
        read-only. A caller who cannot see the dashboard at all receives 403,
        not an all-false set: the two mean different things to a UI.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: Effective capabilities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/scopes/{scopeId}/dashboards/{slug}/permissions:
    get:
      operationId: getDashboardPermissions
      tags: [access]
      summary: Role assignments on one dashboard
      description: >
        The assignments the host store reports, complete: if the host's model
        has inheritance, inherited assignments are in the list. Requires
        `canManagePermissions`, so this is not a way to enumerate a tenant's
        users.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/slug"
      responses:
        "200":
          description: The assignments that apply to this dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionAssignments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    put:
      operationId: setDashboardPermissions
      tags: [access]
      summary: Replace the role assignments on one dashboard
      description: >
        The list replaces what is stored; omitting an authority removes its
        assignment. `authorityId` is whatever the host calls a user or a group
        — this package never interprets it.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/slug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionAssignments"
      responses:
        "204":
          description: Replaced. No body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/scopes/{scopeId}/datasources:
    get:
      operationId: listDataSources
      tags: [datasources]
      summary: Datasources in one tenant
      description: >
        Datasources belong to the tenant, not to the scope, so this returns
        every datasource the tenant has. The scope in the path is what the
        caller's role is answered against. Never carries a credential: a
        record names one through `credentialRef`.


        A deployment with no datasource store configured answers `404`.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
      responses:
        "200":
          description: The tenant's datasources. An empty list is a 200, not a 404.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DataSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      operationId: createDataSource
      tags: [datasources]
      summary: Create a datasource
      description: The server assigns the identifier.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceInput"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/scopes/{scopeId}/datasources/test:
    post:
      operationId: testDataSourceValues
      tags: [datasources]
      summary: Test a datasource that has not been saved
      description: >
        For an operator filling in a form: find out the target is wrong
        before storing it. The body may carry a credential, which is the one
        request in this API besides a credential write that does. It is used
        for the one probe and dropped — never logged, echoed or stored.


        `test` is a reserved identifier, so no datasource can be addressed at
        this path.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [datasource]
              properties:
                datasource:
                  $ref: "#/components/schemas/DataSourceInput"
                credential:
                  $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: >
            The outcome. A target that refused the credential is a `200` with
            `success: false`, not an error status: the caller asked a
            question and got an answer.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ConnectionTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/scopes/{scopeId}/datasources/{dataSourceId}/test:
    post:
      operationId: testDataSource
      tags: [datasources]
      summary: Test a stored datasource
      description: >
        Resolves the credential the datasource names and probes its target.
        The credential does not appear in the request or the response.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/dataSourceId"
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ConnectionTestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/scopes/{scopeId}/datasources/{dataSourceId}:
    get:
      operationId: getDataSource
      tags: [datasources]
      summary: One datasource
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/dataSourceId"
      responses:
        "200":
          description: The datasource.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DataSource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: replaceDataSource
      tags: [datasources]
      summary: Create or replace a datasource
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/dataSourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataSourceInput"
      responses:
        "200":
          description: The stored datasource.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/DataSource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      operationId: deleteDataSource
      tags: [datasources]
      summary: Delete a datasource
      description: >
        Deleting one that is not there is a `204`, so a retried delete is not
        an error. The credential it named is left alone.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/dataSourceId"
      responses:
        "204":
          description: Deleted. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/scopes/{scopeId}/credentials:
    get:
      operationId: listCredentials
      tags: [credentials]
      summary: Credentials in one tenant, without their secrets
      description: >
        Served only where the vault can be written to. A deployment whose
        credentials belong to another system — which is the case inside
        modulariot — answers `404` on every route under `/credentials`,
        because creating one here would write to a store that is not the
        source of truth.


        A summary never carries a secret. `preview` is at most the last four
        characters of a value long enough that four characters give nothing
        away, and is absent otherwise.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
      responses:
        "200":
          description: The tenant's credentials, as summaries.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CredentialSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/scopes/{scopeId}/credentials/{credentialRef}:
    get:
      operationId: getCredential
      tags: [credentials]
      summary: One credential, without its secret
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/credentialRef"
      responses:
        "200":
          description: The summary. Never the secret.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CredentialSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      operationId: putCredential
      tags: [credentials]
      summary: Create or replace a credential
      description: >
        The one request in this API that carries a secret. It is stored and
        never echoed: the response is the summary, the same shape the listing
        returns.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/credentialRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialInput"
      responses:
        "200":
          description: The summary of what was stored.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/CredentialSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    delete:
      operationId: deleteCredential
      tags: [credentials]
      summary: Delete a credential
      description: >
        A datasource still naming it is left alone and will fail to resolve.
        Nothing here checks, because the vault does not know what names it.
      parameters:
        - $ref: "#/components/parameters/tenantId"
        - $ref: "#/components/parameters/scopeId"
        - $ref: "#/components/parameters/credentialRef"
      responses:
        "204":
          description: Deleted. No body.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A JWT from the configured issuer, minted for this server's audience.
        It says who the caller is; it does not say which tenant they are in.
        The tenant comes from the path and is authorized separately, so one
        token serves someone who works in several. The signing algorithm
        follows from the configured key source and is never taken from the
        token. A host that mounts the library supplies its own resolver and
        may accept something else entirely.
    ticketAuth:
      type: apiKey
      in: header
      name: X-Ticket
      description: >
        An opaque ticket, validated against the system that issued it on every
        request that is not answered from a short-lived cache. The header name
        shown here is an example: it is named by configuration, because no
        standard covers it. The emitter's answer identifies the caller; the
        tenant comes from the path and is authorized separately. A ticket the
        emitter refuses is a 401; an emitter that cannot be reached is a 500,
        never a 401.
    embedToken:
      type: apiKey
      in: header
      name: X-Miot-Embed-Token
      description: Signed embed token carrying tenant scope + capabilities.
    devUser:
      type: apiKey
      in: header
      name: X-Dev-User
      description: >
        **Development only.** Read verbatim, with no verification, when the
        server runs with MIOT_DASHBOARD_INSECURE_AUTH. Anyone who can reach the
        port can then claim to be anyone, which is why the server refuses this
        setting under NODE_ENV=production. It is documented here so that "Try
        it out" works against a dev server before an identity provider exists.

  parameters:
    tenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
      description: >
        The tenant this request acts in. Checked against the caller's
        entitlement before anything else happens; naming one they are not
        entitled to is a 403, indistinguishable from a tenant that does not
        exist. It is in the path rather than the credential so that one
        credential can serve a caller who works in several tenants.
    scopeId:
      name: scopeId
      in: path
      required: true
      schema: { type: string }
      description: >
        Host-defined container (site, workspace, folder) inside the tenant.
        Checked against the caller's membership; never trusted on its own.
    slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    dataSourceId:
      name: dataSourceId
      in: path
      required: true
      schema: { type: string }
      description: Server-assigned identifier, returned when the datasource was created.
    credentialRef:
      name: credentialRef
      in: path
      required: true
      schema: { type: string }
      description: >
        Caller-chosen handle a datasource names. It addresses a credential and
        is not one, so it is safe in a path, a log line and a listing.
    ifMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: >
        The revision the caller believes it is replacing, as an integer. A
        weak-validator prefix and surrounding quotes are tolerated. Omit only
        for a first write; a mismatch is a 409, never a merge.
      example: "3"

  responses:
    BadRequest:
      description: >
        The request could not be understood: a body that is not JSON, an
        `If-Match` that is not an integer, or an assignment list with a
        malformed entry. The message names the offending field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "'assignments[0].role' must be one of Consumer, Contributor, Editor, Coordinator"
            status: 400
            code: BAD_REQUEST
    Unauthorized:
      description: No credential, or one that did not resolve to an identity.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Authentication required
            status: 401
            code: UNAUTHENTICATED
    Forbidden:
      description: >
        The credential cannot perform this action here. `reason` says why:
        TENANT_SCOPE — the scope is not reachable with this credential
        (foreign tenant, unknown scope and no membership are indistinguishable
        by design, and no store was consulted); EMBED_SCOPE — an embed token
        used outside the one dashboard it names; CAPABILITY — in scope, but
        the effective capabilities do not include the action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: The requested scope is not accessible with these credentials
            status: 403
            code: FORBIDDEN
            reason: TENANT_SCOPE
    NotFound:
      description: >
        The dashboard does not exist in the caller's tenant — or the path is
        not one this API serves. An unsupported method on a real path answers
        404 rather than 405 on purpose: which methods a path accepts is not
        something an unauthorized caller should be able to enumerate.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >
        The `If-Match` revision is not the stored one: something else was
        written since the caller loaded it. Reload, reapply, retry.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Dashboard was modified by someone else
            status: 409
            code: CONFLICT

  schemas:
    Error:
      description: >
        The one error envelope. Superset of the shape apps/app dashboard routes
        already return, so existing clients keep working when routes are
        strangled onto the package. Messages are safe to display and never
        carry credentials, connection strings or stack text.
      type: object
      required: [error, status, code]
      properties:
        error:
          type: string
          description: Human-readable message.
        status:
          type: integer
          description: HTTP status, repeated in the body for clients that lose it.
        code:
          type: string
          enum:
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - BAD_REQUEST
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - UPSTREAM_ERROR
            - INTERNAL_ERROR
        reason:
          type: string
          description: Present on 403 only.
          enum: [TENANT_SCOPE, EMBED_SCOPE, CAPABILITY]
    DashboardSummary:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          description: Identifies the dashboard within its scope.
        name:
          type: string
          description: Display name, as the host store records it.
    DashboardConfig:
      description: >
        The dashboard document — layout, widgets and their datasource
        bindings. `null` means nothing has been saved at this slug yet.


        Described in `dashboard-config.schema.json` beside this file, generated
        from the zod schemas in `@microboxlabs/miot-dashboard-contract/schema`.
        The two files are siblings on disk and as the server serves them, so
        the reference below resolves either way.
      oneOf:
        - $ref: "dashboard-config.schema.json#/definitions/DashboardConfig"
        - type: "null"
    SaveResult:
      type: object
      required: [revision, updatedAt]
      properties:
        revision:
          type: integer
          minimum: 0
          description: >
            Monotonic counter. Send it back as `If-Match` on the next write.
        updatedAt:
          type: string
          format: date-time
          description: ISO-8601, as the store recorded it.
    PermissionAssignments:
      type: object
      required: [assignments]
      properties:
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/PermissionAssignment"
    PermissionAssignment:
      type: object
      required: [authorityId, role]
      properties:
        authorityId:
          type: string
          minLength: 1
          description: >
            Host-defined user or group identifier. Opaque to this package,
            compared only against what the identity seam reports.
        role:
          $ref: "#/components/schemas/Role"
    Capabilities:
      description: Identical to the client draft's Capabilities (Seam F vocabulary).
      type: object
      required: [readOnly, canEdit, canShare, canManagePermissions, canDelete]
      properties:
        readOnly: { type: boolean }
        canEdit: { type: boolean }
        canShare: { type: boolean }
        canManagePermissions: { type: boolean }
        canDelete: { type: boolean }
    Role:
      description: >
        Role vocabulary, shared with PermissionAssignments in the client draft.
        Default capability mapping — Consumer: view. Contributor: view, plus
        edit of dashboards they created. Editor: edit and share. Coordinator:
        everything. Creating a dashboard in a scope needs Contributor or above
        in that scope.
      type: string
      enum: [Consumer, Contributor, Editor, Coordinator]
    DataSource:
      type: object
      required: [id, name, type, isActive, target, updatedAt]
      description: >
        A datasource as it may be shown. No property here is a secret; the
        credential half never appears in any response.
      properties:
        id:
          type: string
          description: Assigned by the server on create.
        name: { type: string }
        type:
          $ref: "#/components/schemas/DataSourceKind"
        description: { type: string }
        isActive:
          type: boolean
          description: An inactive datasource stays listed and is not queried.
        target:
          type: string
          description: >
            Base URL for POSTGREST, dataset reference for BIGQUERY. Never
            carries embedded credentials.
        credentialRef:
          type: string
          description: >
            Handle the vault resolves. Absent for a datasource needing no
            authentication.
        updatedAt:
          type: string
          format: date-time
    DataSourceInput:
      type: object
      required: [name, type, isActive, target]
      description: Unknown fields are refused rather than ignored.
      properties:
        name: { type: string }
        type:
          $ref: "#/components/schemas/DataSourceKind"
        description: { type: string }
        isActive: { type: boolean }
        target:
          type: string
          description: >
            A POSTGREST target must be https, or a loopback address. It is
            checked when stored rather than when first used, because the
            server calls it with a credential attached.
        credentialRef: { type: string }
    DataSourceKind:
      type: string
      enum: [POSTGREST, BIGQUERY]
    CredentialSummary:
      type: object
      required: [ref, kind, updatedAt]
      description: Everything here is safe to show. That is why the type exists.
      properties:
        ref: { type: string }
        kind:
          $ref: "#/components/schemas/CredentialKind"
        preview:
          type: string
          description: >
            Enough to recognize which credential this is, never enough to use
            it. Absent when no such value can be derived.
        updatedAt:
          type: string
          format: date-time
    CredentialKind:
      type: string
      enum:
        [NONE, BEARER, API_KEY_HEADER, API_KEY_QUERY, BASIC, SERVICE_ACCOUNT]
    CredentialInput:
      description: >
        A credential as an operator supplies it. Every variant but `NONE`
        carries a secret. Discriminated by `kind`; unknown fields are refused,
        so a misspelled `token` fails rather than storing a credential with
        nothing in it.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [NONE] }
        - type: object
          required: [kind, token]
          properties:
            kind: { type: string, enum: [BEARER] }
            token: { type: string }
        - type: object
          required: [kind, header, value]
          properties:
            kind: { type: string, enum: [API_KEY_HEADER] }
            header: { type: string }
            value: { type: string }
        - type: object
          required: [kind, param, value]
          properties:
            kind: { type: string, enum: [API_KEY_QUERY] }
            param: { type: string }
            value: { type: string }
        - type: object
          required: [kind, username, password]
          properties:
            kind: { type: string, enum: [BASIC] }
            username: { type: string }
            password: { type: string }
        - type: object
          required: [kind, projectId, clientEmail, privateKey]
          properties:
            kind: { type: string, enum: [SERVICE_ACCOUNT] }
            projectId: { type: string }
            clientEmail: { type: string }
            privateKey: { type: string }
    ConnectionTestResult:
      type: object
      required: [testable, success, testedAt, message]
      properties:
        testable:
          type: boolean
          description: >
            False where this kind of datasource cannot be exercised from
            here — a BigQuery dataset needs the Google client to say
            anything. Reported rather than given an invented pass.
        success: { type: boolean }
        testedAt:
          type: string
          format: date-time
        message:
          type: string
          description: >
            Short and safe. Never the target's response body, which can quote
            back a credential it was sent.
        status:
          type: integer
          description: What the target answered, when it answered at all.
