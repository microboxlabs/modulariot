# =============================================================================
# ModularIoT — Application Configuration
# =============================================================================
# Sensitive values are read from environment variables (see .env.sample).
# MicroProfile Config resolution order: env vars > .env file > this file.

# --- Component activation ---
# Master switch: set to true for all-in-one mode
miot.component.all.enabled=false
# Individual overrides: defaults to the master switch value
miot.component.fleet.enabled=${miot.component.all.enabled}
miot.component.driver.enabled=${miot.component.all.enabled}
miot.component.tracking.enabled=${miot.component.all.enabled}
miot.component.gateway.enabled=${miot.component.all.enabled}
miot.component.integrations.enabled=${miot.component.all.enabled}
miot.component.conversational.enabled=${miot.component.all.enabled}
miot.integrations.secret-key=${MIOT_INTEGRATIONS_SECRET_KEY:not-configured}

# --- Signal retransmit worker (MEL/Gauss etc.) ---
# Consume PR3 asset-positions-enriched → stamp/match on GPS DB → outbox HTTP.
# Off by default; enable on StreamHub modulith only when GPS + Pulsar are wired.
miot.integrations.retransmit.worker.enabled=${MIOT_INTEGRATIONS_RETRANSMIT_WORKER_ENABLED:false}
miot.integrations.retransmit.max-attempts=${MIOT_INTEGRATIONS_RETRANSMIT_MAX_ATTEMPTS:5}
miot.integrations.retransmit.claim-every=${MIOT_INTEGRATIONS_RETRANSMIT_CLAIM_EVERY:5s}
miot.integrations.retransmit.claim-limit=${MIOT_INTEGRATIONS_RETRANSMIT_CLAIM_LIMIT:20}
miot.integrations.retransmit.lease-seconds=${MIOT_INTEGRATIONS_RETRANSMIT_LEASE_SECONDS:60}
miot.integrations.retransmit.retry-base-seconds=${MIOT_INTEGRATIONS_RETRANSMIT_RETRY_BASE_SECONDS:30}
miot.integrations.retransmit.retry-max-seconds=${MIOT_INTEGRATIONS_RETRANSMIT_RETRY_MAX_SECONDS:900}
miot.integrations.retransmit.pulsar.service-url=${MIOT_INTEGRATIONS_RETRANSMIT_PULSAR_SERVICE_URL:pulsar://localhost:6650}
miot.integrations.retransmit.pulsar.topic=${MIOT_INTEGRATIONS_RETRANSMIT_PULSAR_TOPIC:persistent://streamhub/tracking/asset-positions-enriched}
miot.integrations.retransmit.pulsar.subscription=${MIOT_INTEGRATIONS_RETRANSMIT_PULSAR_SUBSCRIPTION:miot-retransmit-worker}
# Payload: auto | gauss | raw
#   auto  = Gauss v2 format when destination URL looks like GaussControl
#   gauss = always map to Inyección puntos GPS v2 (JSON array + Bearer)
#   raw   = post miot.gps.retransmit@1 JSON as-is (echo / debug)
miot.integrations.retransmit.payload-format=${MIOT_INTEGRATIONS_RETRANSMIT_PAYLOAD_FORMAT:auto}
# Gauss Control (APG2) — position upload auth + field defaults
# Preferred: provider gateway headers (secret):
#   MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_PROVIDER_API_KEY  → X-Provider-Api-Key
#   MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_TARGET_TENANT     → X-Target-Tenant
# Fallback: static bearer OR OAuth (Basic client + password grant / refresh_token):
#   MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_BEARER_TOKEN
#   MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_OAUTH_TOKEN_URL
#   MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_CLIENT_ID / _CLIENT_SECRET
#   MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_USERNAME / _PASSWORD
miot.integrations.retransmit.gauss.tags=${MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_TAGS:;MEL;}
miot.integrations.retransmit.gauss.device-type=${MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_DEVICE_TYPE:gps}
miot.integrations.retransmit.gauss.event-provider=${MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_EVENT_PROVIDER:streamhub}
miot.integrations.retransmit.gauss.device-model=${MIOT_INTEGRATIONS_RETRANSMIT_GAUSS_DEVICE_MODEL:streamhub-miot}
# Privacy pin for outside-MEL mode (env/secret only — do not commit real coords):
#   MIOT_INTEGRATIONS_RETRANSMIT_PRIVACY_PIN_LAT
#   MIOT_INTEGRATIONS_RETRANSMIT_PRIVACY_PIN_LON
#   MIOT_INTEGRATIONS_RETRANSMIT_PRIVACY_PIN_LABEL
# Optional (env only; leave unset when worker off):
#   MIOT_INTEGRATIONS_RETRANSMIT_DEFAULT_URL
#   MIOT_INTEGRATIONS_RETRANSMIT_GPS_REACTIVE_URL / _USERNAME / _PASSWORD
# StreamHub GPS DB (prod_iot_gps) — separate from primary miot control-plane DB.


# --- Modulith async-job worker ---
# Runs modulith-lane async jobs (ECM enqueues with executor=modulith) inside the
# modulith so they never consume ECM CPU. Generic dispatch by job_type via
# ModulithJobHandler beans (calendar_sync today); off by default. Deploy ORDER:
# enable here + set any per-handler config (e.g. the calendar base URL below)
# BEFORE flipping ECM's lane
# (mintral.features.integrationOutbox.calendarSync.executor=modulith), else jobs
# strand unclaimed (ECM stops running them once flipped).
miot.integrations.modulith-worker.enabled=${MIOT_INTEGRATIONS_MODULITH_WORKER_ENABLED:false}
miot.integrations.modulith-worker.claim-every=${MIOT_INTEGRATIONS_MODULITH_WORKER_CLAIM_EVERY:30s}
miot.integrations.modulith-worker.claim-limit=${MIOT_INTEGRATIONS_MODULITH_WORKER_CLAIM_LIMIT:20}
miot.integrations.modulith-worker.lease-seconds=${MIOT_INTEGRATIONS_MODULITH_WORKER_LEASE_SECONDS:120}
# calendar_sync handler: in-cluster miot-calendar (same service ECM points at).
# The handler stays not-ready (its jobs wait) until this is set.
miot.integrations.calendar-sync.miot-calendar.base-url=${MIOT_INTEGRATIONS_CALENDAR_SYNC_MIOT_CALENDAR_BASE_URL:}
# Optional bearer (env only): MIOT_INTEGRATIONS_CALENDAR_SYNC_MIOT_CALENDAR_TOKEN

# Live job-console events: base URL of the quarkus-sse service; each async-job
# state transition is POSTed to {url}/api/v1/events/emit as an EventData frame
# (eventType integrations.job, tenantId = tenant code). Emission is OFF until
# this is set (empty default — fire-and-forget, never blocks the job path).
miot.integrations.job-events.sse-base-url=${MIOT_INTEGRATIONS_JOB_EVENTS_SSE_BASE_URL:}


# --- HTTP ---
quarkus.http.port=8180

# --- Datasource: miot (primary — entity directory, KPI scores, events) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${MIOT_DB_USER:miot}
quarkus.datasource.password=${MIOT_DB_PASSWORD:miot}
quarkus.datasource.reactive.url=${MIOT_DB_REACTIVE_URL:postgresql://localhost:5432/miot}
quarkus.datasource.jdbc.url=${MIOT_DB_JDBC_URL:jdbc:postgresql://localhost:5432/miot}
quarkus.datasource.jdbc.max-size=5


# --- Flyway ---
# Migration is handled programmatically by FlywayMigrator based on active components
quarkus.flyway.migrate-at-start=false
quarkus.flyway.out-of-order=true
# Pin the Quarkus Flyway extension's metadata table to miot_core so any
# *-at-start action (migrate / validate / baseline / repair) inadvertently
# enabled via env (QUARKUS_FLYWAY_MIGRATE_AT_START=true on a deployment, etc.)
# never touches the `public` schema. Mirrors FlywayMigrator's own .schemas()
# call so both Flyway instances (extension + programmatic) agree.
quarkus.flyway.schemas=miot_core
quarkus.flyway.default-schema=miot_core
# Pin the extension's location scan to the always-on schemas. Per-component
# migrations (fleet, driver, tracking, integrations) live under
# FlywayMigrator's component-flag control and must NOT be picked up by the
# extension's classpath scan — otherwise turning a component off via
# MIOT_COMPONENT_<X>_ENABLED=false leaves the migration JAR on the
# classpath and the extension still tries to apply it.
quarkus.flyway.locations=classpath:db/migration/core,classpath:db/migration/resource
# The extension's history table is shared with FlywayMigrator (which
# applies fleet / driver / tracking / integrations entries). Without
# this, the extension's own validate() would fail with "applied
# migration not resolved locally" on any component-scoped row, because
# those SQL files are intentionally outside `quarkus.flyway.locations`.
# Two categories must be tolerated:
#   *:missing → component versions BELOW max resolved (e.g. fleet 0.2.x
#               when core's last is 0.3.0)
#   *:future  → component versions ABOVE max resolved (e.g. driver 0.4.x
#               beyond core's 0.3.0)
quarkus.flyway.ignore-migration-patterns=*:missing,*:future
miot.flyway.base-locations=db/migration/core,db/migration/resource

# --- Hibernate ---
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Auth ---
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/*
quarkus.http.auth.permission.public.policy=permit
# JWT claims to check for client_id (in order). M2M = azp, web = aud
miot.auth.client-id-claims=azp,aud

# --- WhatsApp inbound webhook (Meta Cloud API) ---
# Meta cannot present our JWT, so the inbound webhook is public and verified by its own
# X-Hub-Signature-256 HMAC (POST) + verify-token handshake (GET). It lives at /webhooks/whatsapp —
# OUTSIDE /api/* — because a more-specific permit under /api/* did NOT override the blanket
# `authenticated` policy on Quarkus 3.32.4 (the endpoint returned 401 even with a valid token).
# Keeping it off /api/* removes the precedence question; this explicit permit is belt-and-braces in
# case a catch-all policy is ever added. The path carries no {org}; the org is resolved from the
# payload's phone_number_id, so OrganizationRequestFilter (/api/v1/orgs/**) is never in play.
quarkus.http.auth.permission.whatsapp-webhook.paths=/webhooks/*
quarkus.http.auth.permission.whatsapp-webhook.policy=permit
# Handshake verify token + Meta App secret (Meta App dashboard). Real values via env/secret. The
# defaults are EMPTY (not a placeholder string): the signature verifier and handshake both bail on
# a blank value, so an unset secret/token makes the webhook reject everything — fails closed AND
# leaves no shared published value an attacker could sign a forged payload with.
miot.whatsapp.webhook.verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
miot.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

# --- Health ---
quarkus.smallrye-health.root-path=/q/health

# --- Container image ---
quarkus.container-image.group=microboxlabs
quarkus.container-image.name=miot
quarkus.container-image.tag=${quarkus.application.version:latest}

# --- Dev profile ---
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.datasource.jdbc.url=${MIOT_DB_JDBC_URL:jdbc:postgresql://localhost:5432/miot_dev}
%dev.quarkus.datasource.reactive.url=${MIOT_DB_REACTIVE_URL:postgresql://localhost:5432/miot_dev}
%dev.quarkus.hibernate-orm.log.sql=true

# --- Auth (Dual JWT — Auth0 HS256 + RS256) ---
# DualJwtAuthMechanism can verify HS256 and RS256 tokens with distinct issuers.
#   HS256 — M2M device tokens (tracking, stream) signed with shared secret
#   RS256 — Web app tokens (fleet, driver) signed with Auth0's RSA key pair
miot.auth.hs256-issuer=${AUTH0_HS256_ISSUER:${AUTH0_ISSUER:https://placeholder.auth0.com/}}
miot.auth.rs256-issuer=${AUTH0_RS256_ISSUER:${AUTH0_ISSUER:https://placeholder.auth0.com/}}
# HS256 signing secret (from Auth0 API > Settings > Signing Secret)
miot.auth.hs256-secret=${AUTH0_HS256_SECRET:not-configured}
# RS256 JWKS endpoint (Auth0 discovery)
miot.auth.jwks-url=${AUTH0_JWKS_URL:not-configured}
# Expected audiences (reject tokens issued for other APIs)
miot.auth.hs256-audience=${AUTH0_HS256_AUDIENCE:not-configured}
miot.auth.rs256-audience=${AUTH0_RS256_AUDIENCE:not-configured}
# SmallRye JWT is still on the classpath for JsonWebToken principal support
smallrye.jwt.path.groups=scope

# --- Tax id validation ---
# Selects the active TaxIdValidator implementation by code. Ship-today: chilean_rut.
miot.tax-id.validator=${MIOT_TAX_ID_VALIDATOR:chilean_rut}

# --- Alfresco connection ---
# Base URL of the Alfresco instance (everything up to /alfresco, no trailing slash).
miot.alfresco.url=${ALFRESCO_URL:http://localhost:8080/alfresco}
# Authentication scheme used by the Alfresco REST client. One of:
#   oauth — forward the caller's JWT as a Bearer token (requires Alfresco SSO)
#   basic — HTTP Basic with miot.alfresco.basic.username/password (dev, CI, server-to-server)
#   stub  — short-circuit with canned data; no HTTP traffic (default while Phase 4 lands)
miot.alfresco.auth=${MIOT_ALFRESCO_AUTH:stub}
miot.alfresco.basic.username=${ALFRESCO_USER:}
miot.alfresco.basic.password=${ALFRESCO_PASSWORD:}
# REST client base — points the typed client at the public v1 core API.
quarkus.rest-client.alfresco-core.url=${miot.alfresco.url}/api/-default-/public/alfresco/versions/1
quarkus.rest-client.alfresco-core.connect-timeout=10000
quarkus.rest-client.alfresco-core.read-timeout=15000

# --- Fork engine (within miot-gateway) ---
# Master switch for the fork engine
fork.enabled=${FORK_ENABLED:false}
#
# Rules are configured via indexed properties. For non-trivial setups,
# mount a ConfigMap as an additional application.properties file.
#
# Example rule — asset-id based canary fork to storm:
#
#   fork.rules[0].id=asset-track-canary
#   fork.rules[0].enabled=true
#   fork.rules[0].paths[0]=/v1/asset/track
#   fork.rules[0].paths[1]=/api/v1/asset/track
#   fork.rules[0].body-parser=json
#   fork.rules[0].key-field=asset_id
#   fork.rules[0].filter-file=/config/asset-ids.txt        ← K8s ConfigMap volume mount
#   fork.rules[0].targets[0].id=storm
#   fork.rules[0].targets[0].mirror-host=${FORK_STORM_HOST:not-configured}
#   fork.rules[0].targets[0].mirror-path=/v1/asset/track
#   fork.rules[0].targets[0].timeout=5000
#
# Filter file format (/config/asset-ids.txt):
#   # One routing key per line, # comments and blank lines ignored
#   SVSX88
#   ABC123
#
# Kubernetes ConfigMap:
#   data:
#     asset-ids.txt: |
#       # Canary asset IDs for storm environment
#       SVSX88
#
# Env var naming for rules (MicroProfile indexed list convention):
#   FORK_RULES_0__ID, FORK_RULES_0__PATHS_0_, FORK_RULES_0__TARGETS_0__MIRROR_HOST, etc.

# --- Micrometer / Prometheus ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# --- OpenAPI / Swagger UI ---
quarkus.smallrye-openapi.info-title=ModularIoT API
quarkus.smallrye-openapi.info-version=${quarkus.application.version:1.0.0-SNAPSHOT}
quarkus.smallrye-openapi.info-description=Multi-tenant fleet and driver resource management with KPI scoring
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=oidc
quarkus.smallrye-openapi.security-scheme-description=JWT Bearer token from Auth0 M2M client credentials flow.
quarkus.swagger-ui.always-include=true

# --- Bulk Sync ---
miot.bulk-sync.max-batch-size=1000

# --- Deferred FK Reconciliation ---
miot.reconciliation.cron=0 */15 * * * ?

# --- Knowledge distiller (semantic-layer learning, R3) ---
# OFF by default: the background reflector pass is an ops opt-in per env, and its
# outbound call to the harness /distill endpoint needs a service credential in an
# auth-enabled deployment (provision that, then flip MIOT_DISTILL_ENABLED). The
# cron fires regardless but returns immediately while disabled. It never promotes
# a fact — it only stages pending candidates for the human gate.
miot.distill.enabled=${MIOT_DISTILL_ENABLED:false}
miot.distill.cron=${MIOT_DISTILL_CRON:0 0 * * * ?}
miot.distill.lookback-hours=${MIOT_DISTILL_LOOKBACK_HOURS:24}
miot.distill.batch-limit=${MIOT_DISTILL_BATCH_LIMIT:200}
miot.distill.auth-mode=${MIOT_DISTILL_AUTH_MODE:m2m}
# Service bearer for the outbound /distill call when the harness runs auth-enabled
# (prod): set the MIOT_DISTILL_HARNESS_TOKEN env var (relaxed-mapped to
# miot.distill.harness-token) when enabling the distiller. Intentionally NOT declared
# as a property here — an empty ${...:} expression fails the String injection at boot;
# the job's @ConfigProperty defaultValue="" covers the dev/unset (header-only) case.

# --- External messaging ---
#   log    = standalone mode: messages logged at DEBUG, not sent (default)
#   pulsar = production: publishes to Apache Pulsar
miot.messaging.type=${MIOT_MESSAGING_TYPE:log}
pulsar.client.serviceUrl=${PULSAR_URL:pulsar://localhost:6650}
miot.tracking.pulsar.topic=${MIOT_TRACKING_TOPIC:not-configured}
miot.tracking.pulsar.subscription=${MIOT_TRACKING_SUBSCRIPTION:asset-positions-sub}

# --- Native image (Pulsar client) ---
# EnrichedPositionRetransmitConsumer is omitted when quarkus.native.enabled=true
# (UnlessBuildProperty) so the default native CI image does not close-world
# analyze pulsar-client. If a native retransmit build is ever required, also
# keep these run-time inits (shaded Netty io_uring) under miot-integrations
# META-INF/native-image and rebuild with the consumer included.
quarkus.native.additional-build-args=\
--initialize-at-run-time\\=org.apache.pulsar.shade.io.netty.incubator.channel.uring.IOUringEventLoopGroup,\
--initialize-at-run-time\\=org.apache.pulsar.shade.io.netty.incubator.channel.uring.IOUring,\
--initialize-at-run-time\\=org.apache.pulsar.shade.io.netty.incubator.channel.uring.Native
