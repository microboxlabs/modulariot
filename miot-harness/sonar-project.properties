# SonarQube Configuration
sonar.projectKey=microboxlabs_modulariot-harness
sonar.projectName=ModularIoT Harness
sonar.organization=microboxlabs

# Source and test paths (relative to this directory)
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.11,3.12

# Exclude caches and virtualenvs from analysis
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.mypy_cache/**,**/.ruff_cache/**

# No coverage reports are uploaded; exclude all files from coverage.
sonar.coverage.exclusions=**/*

sonar.sourceEncoding=UTF-8
