# Spanish text of the rule findings, by code. The app translates the same codes
# (findingXxx keys in lang/*.json); this text is the fallback and the log text.
# Parameters named level* take a level number; left and right take a CEL type.
sourceMissing = La fuente de datos no existe.
lifecycleMissing = Falta decir cuándo se abre y se cierra el caso.
familyTooLong = La familia no puede tener más de {max} caracteres.
engineNotReady = El motor aún no evalúa todas las variables de esta versión: déjala En prueba.
noLevelApplies = Al menos un nivel debe aplicar.
levelsOutOfRange = Cada nivel va del 1 al 4 y aparece una vez.
recurrenceEntity = La repetición se cuenta por patente o por conductor.
recurrenceMinimum = La repetición necesita al menos 2 casos, 1 día y subir al menos un nivel.
measureMissing = Este nivel compara la medida, pero el síntoma no tiene medida.
operatorNeedsSla = Si interviene un operador, el nivel necesita un SLA.
stepNoContact = El paso {n} no dice a quién contactar.
stepNoMinutes = El paso {n} necesita minutos.
gapAt = Con {at} exactos ningún nivel aplica.
gapBetween = Entre {from} y {to} ningún nivel aplica.
gapAtHeld = Con {at} s sostenidos exactos ningún nivel aplica.
gapBetweenHeld = Entre {from} y {to} s sostenidos ningún nivel aplica.
levelsOverlap = {levelA} y {levelB} se solapan: con medida {measure} y {held} s sostenidos se cumplen los dos.
unknownValue = «{field}» no toma el valor «{value}»; sus valores son {values}.
conditionRepeated = La condición «{term}» está repetida.
engineUnsupported = El motor aún no evalúa «{path}»: solo se puede publicar En prueba.
trueAndFalse = «{field}» no puede ser verdadero y falso a la vez; nunca se cumpliría.
twoValues = «{field}» no puede tener dos valores a la vez; nunca se cumpliría.
emptyRange = «{field}» mayor que {lower} y menor que {upper} nunca se cumple.
valueOutsideRange = «{field}» igual a {value} queda fuera de sus otros límites; nunca se cumpliría.
twoMinimums = Dos mínimos para «{field}»; basta el mayor ({lower}).
twoMaximums = Dos máximos para «{field}»; basta el menor ({upper}).
ruleEmpty = La expresión está vacía.
ruleInvalid = Expresión no válida.
ruleNotCondition = La condición debe dar sí o no.
ruleNotNumber = La medida debe dar un número.
ruleIncomplete = La expresión está incompleta.
ruleUnexpected = Hay un símbolo inesperado: {symbol}.
ruleOperator = No se puede usar «{op}» con {left}.
ruleOperatorBetween = No se puede usar «{op}» entre {left} y {right}.
ruleNoField = El campo «{field}» no existe en esta fuente.
ruleNoName = «{name}» no existe en esta fuente.
ruleCel = {detail}
level.1 = Bajo observación
level.2 = Comprometida
level.3 = Crítica
level.4 = Código negro
type.double = número
type.int = número entero
type.uint = número entero
type.string = texto
type.bool = sí/no
type.null_type = vacío
type.object = objeto
