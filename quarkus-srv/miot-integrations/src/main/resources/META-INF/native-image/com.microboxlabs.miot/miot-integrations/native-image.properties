# Pulsar client shades Netty io_uring. Build-time class init tries to open an
# io_uring ring fd (fails in CI / restricted containers). Defer to run time.
# See native build: UnsatisfiedLinkError / "failed to create io_uring ring fd".
Args = --initialize-at-run-time=org.apache.pulsar.shade.io.netty.incubator.channel.uring.IOUringEventLoopGroup \
       --initialize-at-run-time=org.apache.pulsar.shade.io.netty.incubator.channel.uring.IOUring \
       --initialize-at-run-time=org.apache.pulsar.shade.io.netty.incubator.channel.uring.Native
