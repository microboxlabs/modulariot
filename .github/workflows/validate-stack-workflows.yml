name: Validate stack workflows

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/app-nightly.yml'
      - '.github/workflows/ci.yaml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/web.yml'
      - '.github/workflows/quarkus.yml'
      - '.github/workflows/harness.yaml'
      - '.github/workflows/validate-stack-workflows.yml'
  push:
    branches: [trunk, main]
    paths:
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - run: node --test .github/tests/resolve-trunk-builds.test.js
      - run: python .github/tests/test-stack-workflow.py
