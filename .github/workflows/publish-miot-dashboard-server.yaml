name: Publish miot-dashboard-server

# Releases @microboxlabs/miot-dashboard-server to npmjs, triggered by an
# annotated `miot-dashboard-server@v*` tag (see .agents/skills/tag-release).
#
# Two things here are not in the other publish workflows, and both exist
# because this package is meant to be installed by people outside this repo:
#
#   * The tag has to name the version in package.json. The tag convention
#     says they match; nothing enforced it, so a tag could announce v0.2.0
#     while the registry received 0.1.0, and the git history would then
#     disagree with npm forever.
#   * The tarball is installed and run before it is published. Tests import
#     the TypeScript source and the Docker image copies `dist/` directly, so
#     neither exercises the `exports` map or the `files` list — a wrong path
#     in either is invisible until a consumer's `npm install` fails. The
#     bundler has already rewritten a `node:` specifier in this package once
#     (see src/store/sqlite-driver.ts), which is the same class of fault: it
#     only appears in the built artifact.
#
# **Publish @microboxlabs/miot-dashboard-contract first.** This package
# depends on it, so the consumer install below pulls that version from the
# registry and fails if it is not there yet. That failure is the ordering
# working, not a problem to route around — see
# publish-miot-dashboard-contract.yaml.
#
# Authentication: npm trusted publishing (OIDC), which needs no stored
# credential — hence `id-token: write` and no token in the publish step.
# Trusted publishing is configured on the package's page on npmjs.com, so it
# cannot be set up before the package exists: the first release authenticates
# with NPM_TOKEN instead. Once the trusted publisher is configured, delete
# that secret and this keeps working.

on:
  push:
    tags:
      - "miot-dashboard-server@v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. miot-dashboard-server@v0.1.0)"
        required: true

env:
  NODE_VERSION: "24"
  PACKAGE_NAME: "@microboxlabs/miot-dashboard-server"
  PACKAGE_DIR: "packages/miot-dashboard-server"
  TAG_PREFIX: "miot-dashboard-server@v"

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishers

    steps:
      - uses: actions/checkout@v5
        with:
          # Honor a manual-dispatch tag only when it's a real
          # miot-dashboard-server@v* tag; otherwise fall back to the
          # triggering ref (the push tag, or the ref the dispatch ran from)
          # so an arbitrary ref can't be published.
          #
          # `refs/tags/` is explicit because for an unqualified ref
          # actions/checkout looks for a branch BEFORE a tag. A branch named
          # `miot-dashboard-server@v0.1.0` would otherwise be published as
          # though it were the tag, and the check below would not notice: it
          # reads the ref's text and package.json, both of which a branch can
          # satisfy. A dispatch naming a tag that does not exist now fails in
          # checkout rather than publishing something else.
          ref: ${{ startsWith(inputs.tag, 'miot-dashboard-server@v') && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: turbo-repo/package-lock.json

      # The tag is the release's public name. If it disagrees with
      # package.json, one of the two is a lie about what was published, and
      # the registry keeps whichever version the manifest happened to carry.
      - name: Check the tag names the version being published
        id: version
        env:
          # Through the environment rather than interpolated into the script.
          # The dispatch input is text someone else wrote, and bash runs a
          # command substitution inside double quotes, so a tag ending in
          # `$(...)` would execute before anything here had a chance to
          # validate it.
          RELEASE_REF: ${{ startsWith(inputs.tag, 'miot-dashboard-server@v') && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          case "$ref" in
            "$TAG_PREFIX"*) ;;
            *)
              echo "This workflow publishes ${TAG_PREFIX}<version> tags; got '$ref'." >&2
              exit 1
              ;;
          esac
          tagged="${ref#"$TAG_PREFIX"}"
          declared="$(node -p "require('./turbo-repo/$PACKAGE_DIR/package.json').version")"
          if [[ "$tagged" != "$declared" ]]; then
            echo "The tag says $tagged but $PACKAGE_DIR/package.json says $declared." >&2
            echo "Bump the manifest and re-tag; do not publish a version the tag does not name." >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"
          # The summary reports this rather than github.ref_name, which on a
          # manual dispatch names the ref the dispatch ran from (`trunk`),
          # not the tag being published.
          echo "tag=$ref" >> "$GITHUB_OUTPUT"
          echo "Publishing $PACKAGE_NAME@$declared"

      # Publish from a fresh, lockfile-verified install. No restorable
      # node_modules cache — one populated by any branch's CI could poison the
      # published tarball. setup-node's `cache: npm` still keeps this fast by
      # caching the integrity-checked download tarballs.
      - name: Install dependencies
        run: npm ci
        working-directory: turbo-repo

      - name: Build package
        run: npx turbo run build --filter=$PACKAGE_NAME
        working-directory: turbo-repo

      - name: Run lint
        run: npx turbo run lint --filter=$PACKAGE_NAME
        working-directory: turbo-repo

      # check-types is `tsc --noEmit` plus scripts/guard-imports.mjs, which is
      # what keeps React, Next, Fastify and Alfresco out of the published code.
      - name: Run type check and the import guard
        run: npx turbo run check-types --filter=$PACKAGE_NAME
        working-directory: turbo-repo

      - name: Run tests
        run: npx turbo run test --filter=$PACKAGE_NAME
        working-directory: turbo-repo

      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --workspace="$PACKAGE_DIR" --pack-destination "$RUNNER_TEMP/release"
          tarball="$RUNNER_TEMP/release/microboxlabs-miot-dashboard-server-${{ steps.version.outputs.version }}.tgz"
          if [[ ! -f "$tarball" ]]; then
            echo "npm pack did not produce $tarball. Contents:" >&2
            ls -la "$RUNNER_TEMP/release" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
        working-directory: turbo-repo

      # Everything below runs against the installed tarball, in a directory
      # with no relationship to this repo, so a file that `files` forgot or a
      # path the `exports` map gets wrong fails here rather than for a user.
      - name: Install the tarball as a consumer would
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          # jose is an optional peer, installed because the verified identity
          # path needs it and the run below exercises that path.
          npm install --no-audit --no-fund "${{ steps.pack.outputs.tarball }}" jose

      - name: Resolve every published entry point
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          cat > check-exports.mjs <<'CHECK'
          const entries = [
            "",
            "/http",
            "/identity",
            "/store-sql",
            "/store-cloud",
            "/testing",
            "/server",
            "/next",
          ];

          for (const entry of entries) {
            const specifier = "@microboxlabs/miot-dashboard-server" + entry;
            const loaded = await import(specifier);
            const names = Object.keys(loaded);
            if (names.length === 0) {
              throw new Error(`${specifier} resolved but exports nothing`);
            }
            console.log("ok", entry || ".", "->", names.length, "exports");
          }
          CHECK
          node check-exports.mjs

      - name: Run the published binary
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          # A random secret, so the run proves the verified identity path
          # assembles rather than that an insecure fallback exists. A fixed
          # port because the config refuses 0.
          PORT=3178 \
          MIOT_DASHBOARD_STORE=sqlite \
          MIOT_DASHBOARD_DOCUMENTS=fs \
          MIOT_DASHBOARD_JWT_ISSUER=https://issuer.invalid/ \
          MIOT_DASHBOARD_JWT_AUDIENCE=smoke \
          MIOT_DASHBOARD_JWT_SECRET="$(openssl rand -hex 32)" \
            ./node_modules/.bin/miot-dashboard-server > server.log 2>&1 &

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3178/livez > /dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [[ "${ready:-no}" != "yes" ]]; then
            echo "The published binary never answered /livez." >&2
            cat server.log >&2
            exit 1
          fi

          curl -fsS http://127.0.0.1:3178/readyz | grep -q '"ready"'
          # No credential: the server must refuse rather than answer.
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:3178/tenants/t/scopes/s/dashboards)"
          if [[ "$status" != "401" ]]; then
            echo "An unauthenticated list returned $status, expected 401." >&2
            cat server.log >&2
            exit 1
          fi
          # Both come from the contract package, resolved through the
          # dependency rather than shipped in this tarball, so these two prove
          # that resolution works in an ordinary install and not only in the
          # workspace.
          curl -fsS http://127.0.0.1:3178/openapi.yaml | head -1
          curl -fsS http://127.0.0.1:3178/dashboard-config.schema.json > /dev/null

          cat server.log
          # `|| true` because `set -e` would fail the step on pkill's
          # "nothing matched" exit code if the server had already stopped.
          pkill -f miot-dashboard-server || true

      - name: Publish to npm
        run: npm publish --workspace=$PACKAGE_DIR --access public
        working-directory: turbo-repo
        env:
          # Empty once the trusted publisher is configured on npmjs.com, at
          # which point OIDC (id-token above) is what authenticates.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          {
            echo "# $PACKAGE_NAME@${{ steps.version.outputs.version }}"
            echo ""
            echo "- Published from tag \`${{ steps.version.outputs.tag }}\`"
            echo "- Entry points resolved from the installed tarball, binary answered /livez, /readyz and 401"
          } >> "$GITHUB_STEP_SUMMARY"
