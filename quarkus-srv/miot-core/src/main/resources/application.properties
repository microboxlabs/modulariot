# miot-core REST client bindings.
#
# Consumed by HarnessProxyResource. Default points at the in-cluster
# Kubernetes service name; MIOT_HARNESS_BASE_URL overrides for local
# dev or staging. Test-mode overrides live in HarnessProxyTestProfile
# (points at the WireMock instance the test resource lifecycle starts).
quarkus.rest-client."harness".url=${MIOT_HARNESS_BASE_URL:http://miot-harness:8000}

# Consumed by DashboardProxyResource. The dashboard server verifies the
# forwarded bearer token itself, so this URL is the only thing that has to be
# right here; MIOT_DASHBOARD_BASE_URL overrides for local dev, where the
# standalone server listens on :3070.
quarkus.rest-client."dashboards".url=${MIOT_DASHBOARD_BASE_URL:http://miot-dashboard-server:3070}

# Scope id for orgs with no Alfresco site behind them. The upstream scopes it
# per tenant, so this names a different scope in each org.
miot.dashboards.default-scope=${MIOT_DASHBOARD_DEFAULT_SCOPE:default}

# Shared with the dashboard server. At least 32 characters. Set it and this
# proxy sends the role the membership filter resolved. Unset, it sends no
# assertion headers and the dashboard server resolves membership itself.
miot.dashboards.proxy-key=${MIOT_DASHBOARD_PROXY_KEY:}

# Bound calls to the optional Auth0 application catalog so an unavailable
# service cannot occupy an integrations worker indefinitely.
quarkus.rest-client.auth0-admin.connect-timeout=5000
quarkus.rest-client.auth0-admin.read-timeout=10000

# Same harness base URL for the SSE relay's raw Vert.x streaming client
# (HarnessProxyResource#streamRun). The JSON rest-client buffers full
# responses, so the open-ended event stream needs its own client; it reads
# this plain key (the quoted rest-client key above is awkward to inject).
miot.harness.base-url=${MIOT_HARNESS_BASE_URL:http://miot-harness:8000}

# The GPS database (prod_iot_gps), separate from this modulith's own database, with one login (GpsDatabase).
# MIOT_GPS_REACTIVE_URL is postgresql://host:port/database. Unset: no GPS database.
# gps: symptom processing, retransmit and the data sharing sync.
quarkus.datasource.gps.db-kind=postgresql
quarkus.datasource.gps.jdbc=false
quarkus.datasource.gps.devservices.enabled=false
quarkus.datasource.gps.health-exclude=true
quarkus.datasource.gps.reactive.url=${MIOT_GPS_REACTIVE_URL:}
quarkus.datasource.gps.username=${MIOT_GPS_USERNAME:}
quarkus.datasource.gps.password=${MIOT_GPS_PASSWORD:}
quarkus.datasource.gps.reactive.max-size=6
quarkus.datasource.gps.reactive.idle-timeout=60S
quarkus.datasource.gps.reactive.reconnect-attempts=10
quarkus.datasource.gps.reactive.reconnect-interval=500ms
quarkus.datasource.gps.reactive.additional-properties.application_name=miot-modulith
# gps-read: fleet, data sharing screens, symptom engine and Control Tower, in read-only UTC sessions.
quarkus.datasource."gps-read".db-kind=postgresql
quarkus.datasource."gps-read".jdbc=false
quarkus.datasource."gps-read".devservices.enabled=false
quarkus.datasource."gps-read".health-exclude=true
quarkus.datasource."gps-read".reactive.url=${MIOT_GPS_REACTIVE_URL:}
quarkus.datasource."gps-read".username=${MIOT_GPS_USERNAME:}
quarkus.datasource."gps-read".password=${MIOT_GPS_PASSWORD:}
quarkus.datasource."gps-read".reactive.max-size=4
quarkus.datasource."gps-read".reactive.idle-timeout=60S
quarkus.datasource."gps-read".reactive.additional-properties.application_name=miot-modulith-read
quarkus.datasource."gps-read".reactive.additional-properties.default_transaction_read_only=on
quarkus.datasource."gps-read".reactive.additional-properties.TimeZone=UTC
